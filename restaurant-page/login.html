<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Marea</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>
  <div class="auth-layout">

    <div class="auth-visual">
      <div class="visual-bg"></div>
      <div class="visual-overlay"></div>
      <div class="visual-content">
        <a href="index.html" class="visual-logo">M</a>
        <h2>Welcome back to <span>Marea</span></h2>
        <p>Sign in to manage your reservations, track your orders, and unlock exclusive dining experiences.</p>
        <div class="visual-stats">
          <div><strong>4.9</strong><span>Guest Rating</span></div>
          <div><strong>24</strong><span>Signature Dishes</span></div>
          <div><strong>20+</strong><span>Years</span></div>
        </div>
      </div>
    </div>

    <div class="auth-panel">
      <div class="auth-container">
        <a href="index.html" class="auth-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
          Back to Home
        </a>

        <div class="auth-header">
          <div class="auth-logo-mobile">M</div>
          <h1>Sign In</h1>
          <p>Enter your credentials to access your account</p>
        </div>

        <form class="auth-form" id="loginForm">
          <label class="form-field">
            <span class="field-label">Email Address</span>
            <div class="field-input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="loginEmail" placeholder="your@email.com" required autocomplete="email">
            </div>
          </label>

          <label class="form-field">
            <div class="field-label-row">
              <span class="field-label">Password</span>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <div class="field-input">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="toggle-pass" aria-label="Toggle password visibility">
                <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-closed" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49"/><path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"/><path d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143"/><path d="m2 2 20 20"/></svg>
              </button>
            </div>
          </label>

          <div class="remember-row">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe">
              <span class="custom-checkbox"></span>
              Remember me
            </label>
          </div>

          <button type="submit" class="auth-btn">
            Sign In
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
          </button>
        </form>

        <div class="auth-divider"><span>or continue with</span></div>

        <div class="social-btns">
          <button type="button" class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
            Google
          </button>
          <button type="button" class="social-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.879V14.89h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.989C18.343 21.129 22 16.99 22 12c0-5.523-4.477-10-10-10z"/></svg>
            Facebook
          </button>
        </div>

        <p class="auth-switch">
          Don't have an account? <a href="register.html">Create Account</a>
        </p>
      </div>
    </div>

  </div>

  <script src="auth.js"></script>
</body>
</html>
